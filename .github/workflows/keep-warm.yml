name: Keep backend warm

# Render's free tier spins the API down after idle periods, so the first
# request after a lull pays a ~20-30s cold start (see the MegaMart audit,
# BUG-03 / UI-20). Pinging /api/health on a schedule keeps it warm.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/health
        run: |
          curl -fsS --max-time 20 "https://megamart-1-t8na.onrender.com/api/health" \
            || echo "Health check failed or backend is still cold-starting"
